<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design 3: Pinterest Gestalt — Sveltia CMS Asset Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: hsl(211, 84%, 54%);
    --accent-hover: hsl(211, 84%, 46%);
    --accent-soft: hsl(211, 60%, 94%);
    --pinterest-red: #e60023;
    --bg: #ffffff;
    --bg-warm: #f9f7f5;
    --bg-card: #ffffff;
    --text: #111111;
    --text-secondary: #5f5f5f;
    --text-tertiary: #8e8e8e;
    --text-light: #efefef;
    --border: #dcdcdc;
    --border-light: #ececec;
    --radius: 16px;
    --radius-sm: 8px;
    --radius-pill: 24px;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.06);
    --shadow-card-hover: 0 4px 20px rgba(0,0,0,0.1);
    --shadow-float: 0 8px 32px rgba(0,0,0,0.12);
    --font: 'Inter', -apple-system, sans-serif;
    --transition: 200ms ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg-warm);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* Rail */
  .rail {
    width: 48px; min-width: 48px;
    background: #1a1a1a;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 4px;
  }
  .rail-logo {
    width: 32px; height: 32px;
    background: var(--pinterest-red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 15px;
    margin-bottom: 16px;
  }
  .rail-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #777; cursor: pointer; transition: all var(--transition);
  }
  .rail-btn:hover { color: white; background: rgba(255,255,255,0.1); }
  .rail-btn.active { color: white; background: rgba(255,255,255,0.12); }
  .rail-btn svg { width: 20px; height: 20px; }
  .rail-space { flex: 1; }
  .rail-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ffa726);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 12px; font-weight: 700;
  }

  /* Sidebar */
  .sidebar {
    width: 200px; min-width: 200px;
    background: var(--bg);
    border-right: 1px solid var(--border-light);
    padding: 20px 0;
    display: flex; flex-direction: column;
  }
  .sb-search {
    margin: 0 12px 16px;
    padding: 10px 14px;
    background: var(--bg-warm);
    border: none; border-radius: var(--radius-pill);
    font-size: 13px; font-family: var(--font); color: var(--text);
    outline: none;
    transition: box-shadow var(--transition);
  }
  .sb-search::placeholder { color: var(--text-tertiary); }
  .sb-search:focus { box-shadow: 0 0 0 2px var(--accent); }

  .sb-section { font-size: 12px; font-weight: 700; color: var(--text-tertiary); padding: 12px 16px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .sb-folder {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; cursor: pointer;
    color: var(--text-secondary); font-size: 14px;
    border-radius: 0; transition: all var(--transition);
    font-weight: 500;
  }
  .sb-folder:hover { background: var(--bg-warm); color: var(--text); }
  .sb-folder.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sb-folder svg { width: 18px; height: 18px; }
  .sb-badge {
    margin-left: auto; font-size: 12px; font-weight: 600;
    background: var(--bg-warm); color: var(--text-tertiary);
    padding: 2px 8px; border-radius: 12px;
  }
  .sb-folder.active .sb-badge { background: rgba(37,99,235,0.12); color: var(--accent); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header {
    padding: 20px 28px 0;
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    color: var(--text);
  }
  .header-count {
    font-size: 16px; font-weight: 600; color: var(--text-tertiary);
  }
  .header-gap { flex: 1; }
  .upload-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius-pill);
    background: var(--accent); color: white; border: none;
    font-size: 15px; font-weight: 600; font-family: var(--font);
    cursor: pointer; transition: all var(--transition);
    box-shadow: 0 2px 8px rgba(37,99,235,0.2);
  }
  .upload-btn:hover { transform: scale(1.03); box-shadow: 0 4px 16px rgba(37,99,235,0.3); }
  .upload-btn svg { width: 18px; height: 18px; }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 28px;
  }
  .pill {
    padding: 8px 18px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all var(--transition); border: none;
    background: var(--bg); color: var(--text-secondary);
    box-shadow: var(--shadow-card);
  }
  .pill:hover { background: var(--text); color: white; }
  .pill.active { background: var(--text); color: white; }

  .pill-gap { flex: 1; }

  .search-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: var(--radius-pill);
    background: var(--bg); box-shadow: var(--shadow-card);
    border: none; min-width: 260px;
  }
  .search-pill svg { width: 16px; height: 16px; color: var(--text-tertiary); }
  .search-pill input {
    border: none; outline: none; background: none;
    font-size: 14px; font-family: var(--font); color: var(--text); width: 100%;
  }
  .search-pill input::placeholder { color: var(--text-tertiary); }

  .icon-pill {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg); box-shadow: var(--shadow-card);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-secondary);
    transition: all var(--transition);
  }
  .icon-pill:hover { background: var(--text); color: white; }
  .icon-pill.active { background: var(--text); color: white; }
  .icon-pill svg { width: 18px; height: 18px; }

  /* Grid */
  .grid-scroll {
    flex: 1; overflow-y: auto; padding: 0 24px 24px;
    display: flex; gap: 16px;
  }
  .grid-area { flex: 1; }

  /* Masonry Grid */
  .masonry {
    column-count: 4; column-gap: 14px;
  }
  @media (max-width: 1400px) { .masonry { column-count: 3; } }
  @media (max-width: 1000px) { .masonry { column-count: 2; } }

  .pin {
    break-inside: avoid;
    margin-bottom: 14px;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    background: var(--bg-card);
    box-shadow: var(--shadow-card);
    transition: all var(--transition);
    transform: translateZ(0);
  }
  .pin:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-4px);
  }

  .pin img {
    width: 100%; display: block;
    transition: filter var(--transition);
  }
  .pin:hover img { filter: brightness(0.92); }

  .pin .pin-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
    opacity: 0; transition: opacity var(--transition);
    display: flex; flex-direction: column;
    justify-content: space-between; padding: 12px;
  }
  .pin:hover .pin-overlay { opacity: 1; }

  .pin-top { display: flex; justify-content: space-between; align-items: flex-start; }

  .pin-check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid white;
    background: rgba(0,0,0,0.15); backdrop-filter: blur(4px);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .pin-check:hover { background: rgba(0,0,0,0.3); transform: scale(1.1); }
  .pin-check.on { background: var(--accent); border-color: var(--accent); }
  .pin-check.on::after {
    content: ''; width: 10px; height: 6px;
    border-left: 2.5px solid white; border-bottom: 2.5px solid white;
    transform: rotate(-45deg) translateY(-1px);
  }

  .pin-save {
    padding: 8px 18px; border-radius: var(--radius-pill);
    background: var(--accent); color: white;
    font-size: 14px; font-weight: 700; font-family: var(--font);
    border: none; cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .pin-save:hover { background: var(--accent-hover); transform: scale(1.05); }

  .pin-actions {
    display: flex; gap: 6px;
    justify-content: flex-end;
  }
  .pin-action-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(4px);
    border: none; display: flex; align-items: center; justify-content: center;
    color: var(--text); cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .pin-action-btn:hover { background: white; transform: scale(1.1); }
  .pin-action-btn svg { width: 14px; height: 14px; }

  .pin-bottom { display: flex; flex-direction: column; gap: 2px; }
  .pin-name {
    font-size: 13px; font-weight: 600; color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pin-meta { font-size: 12px; color: rgba(255,255,255,0.7); }

  .pin.selected { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* Document pin */
  .pin.doc-pin .doc-placeholder {
    height: 160px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #fff5f5, #ffe0e0);
  }
  .pin.doc-pin.video .doc-placeholder { background: linear-gradient(135deg, #f0e6ff, #ddd0ff); }
  .pin.doc-pin.vector .doc-placeholder { background: linear-gradient(135deg, #fff5e0, #ffe0b0); }
  .doc-placeholder svg { width: 32px; height: 32px; opacity: 0.5; }
  .doc-placeholder .ext-tag {
    font-size: 12px; font-weight: 700;
    padding: 4px 12px; border-radius: var(--radius-pill);
    background: rgba(0,0,0,0.06); color: var(--text-secondary);
  }

  /* Info Panel */
  .info-panel {
    width: 300px; min-width: 300px;
    background: var(--bg);
    border-radius: var(--radius); margin: 4px 0;
    box-shadow: var(--shadow-float);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .ip-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--border-light);
  }
  .ip-header h3 { font-size: 16px; font-weight: 700; }
  .ip-close {
    width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--bg-warm);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: all 0.15s;
  }
  .ip-close:hover { background: var(--border); color: var(--text); }

  .ip-preview { padding: 16px 20px; }
  .ip-preview img {
    width: 100%; border-radius: var(--radius-sm);
    box-shadow: var(--shadow-card);
  }

  .ip-section { padding: 14px 20px; border-top: 1px solid var(--border-light); }
  .ip-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-tertiary); margin-bottom: 10px;
  }
  .ip-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .ip-row .k { color: var(--text-secondary); }
  .ip-row .v { font-weight: 600; color: var(--text); }

  .ip-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ip-tag {
    padding: 4px 12px; background: var(--bg-warm);
    border-radius: var(--radius-pill); font-size: 12px;
    color: var(--text-secondary); font-weight: 500;
  }

  .ip-actions {
    padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
  }
  .ip-btn {
    padding: 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg);
    font-size: 13px; font-weight: 600; font-family: var(--font);
    color: var(--text-secondary); cursor: pointer;
    transition: all var(--transition); text-align: center;
  }
  .ip-btn:hover { background: var(--bg-warm); color: var(--text); border-color: var(--text); }
  .ip-btn.danger:hover { background: #fff5f5; color: var(--pinterest-red); border-color: var(--pinterest-red); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Animation */
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .pin {
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  .pin:nth-child(1) { animation-delay: 0.02s; }
  .pin:nth-child(2) { animation-delay: 0.05s; }
  .pin:nth-child(3) { animation-delay: 0.08s; }
  .pin:nth-child(4) { animation-delay: 0.11s; }
  .pin:nth-child(5) { animation-delay: 0.14s; }
  .pin:nth-child(6) { animation-delay: 0.17s; }
  .pin:nth-child(7) { animation-delay: 0.20s; }
  .pin:nth-child(8) { animation-delay: 0.23s; }
  .pin:nth-child(9) { animation-delay: 0.26s; }
  .pin:nth-child(10) { animation-delay: 0.29s; }
  .pin:nth-child(11) { animation-delay: 0.32s; }
  .pin:nth-child(12) { animation-delay: 0.35s; }
</style>
</head>

const m = document.getElementById('masonry');
const pins = [
  { type:'img', seed:'p1', h:280, name:'hero-banner.jpg', size:'2.4 MB', selected:true },

  { type:'doc', ext:'PDF', cls:'', name:'brand-guide.pdf', size:'5.2 MB' },

  { type:'img', seed:'p5', h:240, name:'avatar-sarah.png', size:'240 KB' },
  { type:'img', seed:'p6', h:320, name:'office-view.jpg', size:'1.6 MB' },
